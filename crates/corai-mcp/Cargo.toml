[package]
name = "corai-mcp"
description = "ED Corai MCP server: the corai-service tools over the Model Context Protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[dependencies]
corai-activity = { path = "../corai-activity" }
corai-journal = { path = "../corai-journal" }
corai-service = { path = "../corai-service" }
rmcp = { version = "3.9", features = ["server", "transport-io", "macros"] }
sha2 = "0.11"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }

[lints]
workspace = true
