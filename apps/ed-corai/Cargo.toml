[package]
name = "ed-corai"
description = "ED Corai desktop window: what the MCP servers are working on"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[dependencies]
corai-activity = { path = "../../crates/corai-activity" }
corai-data.workspace = true
corai-engine = { path = "../../crates/corai-engine" }
corai-journal = { path = "../../crates/corai-journal" }
corai-update = { path = "../../crates/corai-update" }
serde_json.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.35"

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"
