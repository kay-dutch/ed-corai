[package]
name = "ed-corai-cli"
description = "ED Corai command line: the MCP server for Claude and other AI apps, plus build evaluation and optimisation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[[bin]]
name = "ed-corai-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
corai-mcp = { path = "../../crates/corai-mcp" }
corai-service = { path = "../../crates/corai-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"
